<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <!-- X profile header, 1500x500. The avatar covers the bottom-left corner
       (about x < 400, y > 330), so everything sits right of it. Render:
       rsvg-convert -w 1500 -h 500 marketing/x/header.svg -o marketing/x/header.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2940"/>
      <stop offset="1" stop-color="#141c2d"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="end">
    <text x="1420" y="138" fill="#e5c76b" font-size="25" letter-spacing="5">JAPAN TRIP PREP, CHECKED AND DATED</text>
    <text x="1420" y="248" fill="#f6f2ea" font-size="104" font-weight="700" letter-spacing="-1">Gently Yonder</text>
    <text x="1420" y="310" fill="#f6f2ea" fill-opacity="0.82" font-size="33">What changed · Where to stay · What’s worth booking</text>
  </g>

  <!-- a rail line through the cities we cover -->
  <g>
    <line x1="560" y1="392" x2="1420" y2="392" stroke="#b8945f" stroke-width="3"/>
    <g fill="#141c2d" stroke="#e5c76b" stroke-width="3">
      <circle cx="560" cy="392" r="9"/>
      <circle cx="775" cy="392" r="9"/>
      <circle cx="990" cy="392" r="9"/>
      <circle cx="1205" cy="392" r="9"/>
      <circle cx="1420" cy="392" r="9"/>
    </g>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#f6f2ea" fill-opacity="0.78" text-anchor="middle">
      <text x="560" y="434">Tokyo</text>
      <text x="775" y="434">Kyoto</text>
      <text x="990" y="434">Osaka</text>
      <text x="1205" y="434">Sydney</text>
      <text x="1420" y="434" text-anchor="end">Melbourne</text>
    </g>
  </g>
</svg>
