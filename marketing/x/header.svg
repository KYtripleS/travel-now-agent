<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <!-- X profile header, 1500x500, centred. The avatar covers the bottom-left
       corner (about x < 400, y > 330), so the step line starts right of it.
       Render: rsvg-convert -w 1500 -h 500 marketing/x/header.svg -o marketing/x/header.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2940"/>
      <stop offset="1" stop-color="#141c2d"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="750" y="128" fill="#e5c76b" font-size="25" letter-spacing="5">SMARTER TRAVEL PREP, CHECKED AND DATED</text>
    <text x="750" y="238" fill="#f6f2ea" font-size="104" font-weight="700" letter-spacing="-1">Gently Yonder</text>
    <text x="750" y="300" fill="#f6f2ea" fill-opacity="0.82" font-size="33">What changed · Where to stay · What’s worth booking</text>
  </g>

  <!-- the same five steps for any trip, anywhere -->
  <g>
    <line x1="470" y1="382" x2="1030" y2="382" stroke="#b8945f" stroke-width="3"/>
    <g fill="#141c2d" stroke="#e5c76b" stroke-width="3">
      <circle cx="470" cy="382" r="9"/>
      <circle cx="610" cy="382" r="9"/>
      <circle cx="750" cy="382" r="9"/>
      <circle cx="890" cy="382" r="9"/>
      <circle cx="1030" cy="382" r="9"/>
    </g>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#f6f2ea" fill-opacity="0.78" text-anchor="middle">
      <text x="470" y="424">Plan</text>
      <text x="610" y="424">Book</text>
      <text x="750" y="424">Pack</text>
      <text x="890" y="424">Fly</text>
      <text x="1030" y="424">Arrive</text>
    </g>
  </g>
</svg>
